<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/retroma-web.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  {% seo %}
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --pink-glow: #fd9fcb;
      --pink-dim: #701f44;
      --bg-dark: #250a19;
      --link-accent: #e38efd;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'VT323', monospace;
      color: var(--pink-glow);
      margin: 0;
      padding: 2rem;
      font-size: 1.2rem;
    }

    /* Add scanlines overlay effect */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.4) 50%
      );
      background-size: 100% 2px;
      z-index: 9999;
    }

    /* Typography & Neon Glow */
    h1, h2, h3, h4, h5, h6 {
      text-shadow: 0 0 4px var(--pink-glow), 0 0 8px rgba(255, 85, 163, 0.6);
      letter-spacing: 1px;
      color: var(--pink-glow);
    }

    h1 {
      font-size: 2.2rem;
      margin: 0 0 0.5rem 0;
    }

    h2 {
      font-size: 1.8rem;
      margin: 0 0 0.25rem 0;
      text-decoration: underline;
    }

    /* Table Styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      box-shadow: 0 0 15px rgba(255, 85, 164, 0.452);
    }

    table th {
      border: 2px solid var(--pink-glow);
      padding: 8px 12px;
      text-align: left;
      background-color: #a2186d76;
      text-shadow: 0 0 4px var(--pink-glow), 0 0 8px rgba(214, 46, 124, 0.877);
    }

    table td {
      border: 2px solid var(--pink-glow);
      padding: 8px 12px;
      text-align: left;
      text-shadow: 0 0 4px var(--pink-glow);
    }

    table tr:nth-child(odd) td {
      background-color: rgba(13, 2, 8, 0.5);
    }

    table tr:nth-child(even) td {
      background-color: rgba(112, 31, 68, 0.15);
    }

    /* Highlight style for missing rows */
    tr.missing td {
      background-color: var(--pink-dim);
      color: #ffffff;
      text-shadow: 0 0 5px #ffffff;
      opacity: 0.7;
    }

    table tr:hover td {
      background-color: rgba(255, 85, 163, 0.15);
      text-shadow: 0 0 6px var(--pink-glow), 0 0 12px rgba(255, 85, 163, 0.8);
    }

    /* Status text styling */
    .status {
      color: var(--pink-glow);
      text-shadow: 0 0 4px var(--pink-glow);
      margin: 0.5rem 0 1rem 0;
      font-size: 1rem;
    }

    /* Links styling */
    a {
      color: var(--link-accent);
      text-shadow: 0 0 4px var(--link-accent);
      text-decoration: none;
      border-bottom: 1px solid var(--link-accent);
    }

    a:hover {
      color: var(--pink-glow);
      text-shadow: 0 0 6px var(--pink-glow);
      border-bottom-color: var(--pink-glow);
    }

    /* Styling to match standard Obsidian look */
    mark.obsidian-highlight {
      background-color: rgba(255, 85, 163, 0.3);
      color: #f8a6e4;
      padding: 2px 6px;
      border-radius: 2px;
      text-shadow: 0 0 10px rgba(247, 220, 190, 0.8);
    }

    .obsidian-content {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>
<body class="markdown-preview-view theme-dark">
  <!-- Added the class "obsidian-content" to accurately isolate markdown text -->
  <div class="obsidian-content" style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    {{ content }}
  </div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const contentArea = document.querySelector('.obsidian-content');
    if (!contentArea) return;

    // 1. Temporarily extract and mask code blocks to prevent ruining actual code syntax
    const codeBlocks = [];
    contentArea.querySelectorAll('pre, code, script, style').forEach((el, index) => {
      const placeholder = `___CODE_BLOCK_PLACEHOLDER_${index}___`;
      codeBlocks.push({ placeholder, element: el.outerHTML });
      el.outerHTML = placeholder;
    });

    // 2. Perform the global replacement of ==text== with HTML mark tags
    let html = contentArea.innerHTML;
    const regex = /==([^=\n]+)==/g;
    html = html.replace(regex, '<mark class="obsidian-highlight">$1</mark>');

    // 3. Restore the untouched code blocks back into place
    codeBlocks.forEach(item => {
      html = html.replace(item.placeholder, item.element);
    });

    contentArea.innerHTML = html;
  });
</script>
</body>
</html>
